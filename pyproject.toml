[project]
name = "lightning-hydra-template"
version = "0.1.0"
description = "PyTorch Lightning + Hydra. A very user-friendly template for ML experimentation."
readme = "README.md"
repository = "https://github.com/nathanpainchaud/lighting-hydra-template"
requires-python = ">=3.12,<4"
dependencies = [
    "hydra-colorlog>=1.2.0,<2",
    "hydra-core>=1.3.2,<2",
    "hydra-optuna-sweeper>=1.2.0,<2",
    "lightning>=2.6,<2.7",
    "rich>=15,<16",
    "rootutils>=1.0.7,<2",
    "torchmetrics>=1.9,<1.10",
]
[project.optional-dependencies]
wandb = [
    "wandb>=0.31,<0.32",
]
# torch libraries are not included in the main dependencies because they can be platform-specific
# rather, we leave them as optional dependencies (even though they are required for the code to run)
# and leave it up to the user to indicate which version they want to install
# This solution is inspired by one of the recommended ways to install pytorch listed in uv's documentation:
# https://docs.astral.sh/uv/guides/integration/pytorch/#configuring-accelerators-with-optional-dependencies
# Each extra corresponds to a different platform, so it is up to project maintainers to decide which platforms
# they want to list here, i.e. support
cpu = [
  "torch>=2.15,<2.16",
  "torchvision>=0.29,<0.30",
]
cu132 = [
  "torch>=2.15,<2.16",
  "torchvision>=0.29,<0.30",
]
cu134 = [
  "torch>=2.15,<2.16",
  "torchvision>=0.29,<0.30",
]
"rocm10.0" = [
  "torch>=2.15,<2.16",
  "torchvision>=0.29,<0.30",
  # Unlike CUDA-enabled builds, ROCm-enabled builds introduce transitive dependencies to other
  # packages only hosted on PyTorch's indexes (cf. uv issue: https://github.com/astral-sh/uv/issues/10712).
  # Therefore, we have to explicitly list them here if we want to keep the indexes explicit.
  # An alternative would be to set `tool.uv.index-strategy` to 'unsafe-best-match', but that would mean
  # PyPi dependencies (e.g. networkx, numpy, etc.) that are also found on PyTorch's ROCm index would be
  # pulled from the latter.
  "triton-rocm ; sys_platform == 'linux'",
  "rocm ; sys_platform == 'linux'",
  "rocm-sdk-core ; sys_platform == 'linux'",
  "rocm-sdk-libraries ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1010 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1011 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1012 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1030 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1031 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1032 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1033 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1034 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1035 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1036 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1100 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1101 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1102 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1103 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1150 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1151 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1152 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1153 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1200 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1201 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx1250 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx908 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx90a ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx942 ; sys_platform == 'linux'",
  "rocm-sdk-device-gfx950 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1,<5",
    {include-group = "lint"},
    {include-group = "test"},
]
lint = [
    "docformatter>=1.7.5,<2",
    "ruff>=0.17,<0.18",
]
test = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "sh>=2.2.1,<3",
]

[project.scripts]
template-train = "lightning_hydra_template.train:main"
template-eval = "lightning_hydra_template.eval:main"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13,<0.14"
# Refer to the note above about installing pytorch using optional dependencies,
# especially the link to uv's documentation, to understand this configuration
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu132" },
    { extra = "cu134" },
    { extra = "rocm10.0" },
  ],
]

[tool.uv.sources]
# Refer to the note above about installing pytorch using optional dependencies,
# especially the link to uv's documentation, to understand this configuration
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu132", extra = "cu132" },
  { index = "pytorch-cu134", extra = "cu134" },
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu132", extra = "cu132" },
  { index = "pytorch-cu134", extra = "cu134" },
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
# Explicitly bound transitive dependencies from ROCm-enabled builds to PyTorch's ROCm index
triton-rocm = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
rocm = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
rocm-sdk-core = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
rocm-sdk-libraries = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1010 = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1011 = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1012 = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1030 = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1031 = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1032 = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1033 = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1034 = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1035 = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1036 = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1100 = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1101 = [
  { index = "pytorch-rocm10.0", extra = "rocm10.0", marker = "sys_platform == 'linux'" },
